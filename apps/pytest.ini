# pytest 统一配置(任务 09-28-process-formalization S1 / R1.4)
# 目的:根治 cwd 漂移导致的散落 .pytest_cache(立前 9 处)。
# cache_dir 相对 rootdir 解析;本 ini 位于 apps/,凡 args 可向上寻到本件的
# 调用(engines/my_nodes/chapter_video/build_scripts 等域)rootdir=apps,
# 缓存恒落 apps/output/.pytest_cache(该目录已被 .gitignore:122 apps/output/* 忽略)。
# chapter_video 域虽 cwd=仓库根,但 args 指 apps/ 下路径,rootdir 仍钉 apps/。
# trellis 域 args(.trellis/...)寻不到本件,由 runner(S2)显式 -o cache_dir 兜底。
#
# confcutdir 连带面(2026-09-29 评审发现②补记;confcutdir 默认=rootdir,含边界,
# 且跟 rootdir 走不跟 cwd——仓库根裸跑 apps/ 下 args 同样命中,三形态最小实验实证):
# rootdir 钉 apps/ 后,未来 apps/ 层新增的 conftest.py 会静默加载进全部
# rootdir=apps 的域会话(engines/my_nodes/chapter_video/build_scripts);
# 如需隔离,须对该域显式传 --confcutdir(如 --confcutdir=apps/build/chapter_video)。
# trellis 域 rootdir 非 apps/(args 寻不到本件),不受 apps/ 层 conftest 影响。
#
# 仓库根裸跑残口核对(2026-09-29 同轮):仓库根裸跑 args 在 apps/ 下(如
# apps/build/chapter_video/tests)→ 向上寻到本件,rootdir=apps,无残口;
# args 不在 apps/ 下(如 .trellis/...)→ 寻不到本件,cache 落 cwd——该口子
# runner 已对 trellis 域显式 -o 兜底,人工在仓库根裸跑非 apps/ args 自负散落。
# 既有注释准确性同轮逐条复核:立前 9 处(implement.md S1 实测记载)、
# .gitignore:122(实读核对)、四域 rootdir=apps 与 trellis 兜底(runner 对拍)均准确。
[pytest]
cache_dir = output/.pytest_cache
