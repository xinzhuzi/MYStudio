appId: com.manju2026.manying-studio
productName: 漫影工作室
# Explicit publish metadata: keeps update-info generation offline (no GitHub
# API repository auto-detection, which hangs 600s when github.com is
# unreachable). Actual uploads remain opt-in via --publish.
publish:
  provider: github
  owner: xinzhuzi
  repo: MYStudio
directories:
  buildResources: frontend/assets/brand
  output: release/build
files:
  - from: out
    to: out
    filter:
      - "**/*"
  - package.json
  # Desktop-only packaging guard: exclude web/image-toolchain heavy deps
  - "!node_modules/next/**"
  - "!node_modules/@next/**"
  - "!node_modules/sharp/**"
  - "!node_modules/@img/**"
  # 字体死重排除(09-15 用户裁定提速+瘦身):@fontsource/lxgw 全字重×woff/woff2×百子集
  # ≈236MB;渲染层字体已由 vite 打进 out/,Remotion 字幕已烤进 remotion-bundle
  # (自包含 1237 字体文件,实测 09-15),主进程零引用——node_modules 副本纯死重。
  - "!node_modules/@fontsource/**"
  - "!node_modules/lxgw-wenkai-webfont/**"
  # Runtime package hygiene: keep docs/test artifacts out of app.asar without pruning package export entrypoints
  - "!node_modules/**/docs/**"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  - "!node_modules/**/coverage/**"
  - "!node_modules/**/example/**"
  - "!node_modules/**/examples/**"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.tsx"
  - "!**/.cache/**"
  - "!**/coverage/**"

extraResources:
  - from: .cache/remotion-bundle
    to: remotion-bundle
    filter:
      - "**/*"
  - from: frontend/assets/hyperframes-registry
    to: hyperframes-registry
    filter:
      - "**/*"
      - "!**/.DS_Store"
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!tests/**"
      - "!**/tests/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!README.md"
      - "!**/*.md"
      - "!python/**"
      - "!venv/**"
      - "!**/.DS_Store"
      # 缓存零入包(09-15 用户裁定):.pytest_cache 实测漏进过装机包;.cache 兜底
      - "!**/.pytest_cache/**"
      - "!**/.cache/**"
  # Windows 捆绑 sqlite3 CLI:资产库依赖 SQLite 命令行工具,Windows 无系统
  # sqlite3(仅 macOS/GitHub runner 自带)。二进制由 build/packaging/fetch-sqlite3.mjs
  # 在构建前提供(仓库仅含说明文档,不入库)。
  - from: frontend/assets/sqlite3
    to: sqlite3
    filter:
      - "**/*"
      - "!**/*.md"
  - from: frontend/assets/studio-manuals
    to: studio-manuals
    filter:
      - "**/*"
      # 道劫美术手册 daojie_ink_guofeng 并入安装包(用户 09-22 翻案 08-15
      # 「道劫=个人资产不入包」裁定,方案C:道劫美术风格只保留这一个,
      # 「道劫·新中式」轻量预设卡已整体删除)。
      # story 侧 Daojie_xianxia 排除保留不动(个人资产不入包口径不变,08-25 补排)。
      - "!story_skills/Daojie_xianxia/**"
      # 打包卫生(09-22 方案C 深度审计):macOS Finder 元数据与本机工作流草稿不入包。
      - "!**/.DS_Store"
      - "!**/.zcode/**"
  # 成片调色 LUT 资产（08-18-haldclut-grade；生成源 build/scripts/generate-luts.py）。
  - from: frontend/assets/luts
    to: luts
    filter:
      - "**/*.png"
      - LICENSES.md
  # 转场音效资产（08-18-sfx-beat；Kenney CC0）。
  - from: frontend/assets/sfx
    to: sfx
    filter:
      - "**/*.ogg"
      - LICENSES.md
  # MiniMax-Music3 音乐生成技能资产（08-20;caption 技能全文库 SKILL/references/templates
  # + lessons + 实证配方;渲染层配方经 ?raw 进 asar,此处整库供主进程/未来 LLM 代理路径）。
  - from: frontend/assets/minimax
    to: minimax
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/__MACOSX/**"
      - "!**/.cache/**"
      - "!**/__pycache__/**"
      - "!**/coverage/**"
      - "!**/node_modules/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/*.tmp"
      - "!**/*.bak"
      - "!**/*.map"
      - "!**/*.tsbuildinfo"
      - "!**/*.psd"
      - "!**/*.zip"
asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@remotion/compositor-darwin-arm64/**"
  - "node_modules/@remotion/compositor-win32-x64-msvc/**"
  - "out/main/remotion-browser-worker.cjs"
  - "out/main/remotion-render-worker.cjs"
  - "out/main/hyperframes-worker.cjs"
  - "out/main/chunks/**"

# 图标配置
icon: frontend/assets/brand/manying-studio-icon.ico

mac:
  icon: frontend/assets/brand/manying-studio-icon.icns
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip

win:
  executableName: manying-studio
  icon: frontend/assets/brand/manying-studio-icon.ico
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装包配置
nsis:
  include: frontend/config/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: 漫影工作室
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: frontend/assets/brand/manying-studio-icon.ico
  uninstallerIcon: frontend/assets/brand/manying-studio-icon.ico
  installerHeaderIcon: frontend/assets/brand/manying-studio-icon.ico
