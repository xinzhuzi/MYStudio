appId: com.manju2026.manying-studio
productName: 漫影工作室
# Explicit publish metadata: keeps update-info generation offline (no GitHub
# API repository auto-detection, which hangs 600s when github.com is
# unreachable). Actual uploads remain opt-in via --publish.
publish:
  provider: github
  owner: xinzhuzi
  repo: MYStudio
directories:
  buildResources: frontend/assets/brand
  output: release/build
files:
  - from: out
    to: out
    filter:
      - "**/*"
  - package.json
  # Desktop-only packaging guard: exclude web/image-toolchain heavy deps
  - "!node_modules/next/**"
  - "!node_modules/@next/**"
  - "!node_modules/sharp/**"
  - "!node_modules/@img/**"
  # Runtime package hygiene: keep docs/test artifacts out of app.asar without pruning package export entrypoints
  - "!node_modules/**/docs/**"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  - "!node_modules/**/coverage/**"
  - "!node_modules/**/example/**"
  - "!node_modules/**/examples/**"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.tsx"
  - "!**/.cache/**"
  - "!**/coverage/**"

extraResources:
  - from: .cache/remotion-bundle
    to: remotion-bundle
    filter:
      - "**/*"
  - from: frontend/assets/hyperframes-registry
    to: hyperframes-registry
    filter:
      - "**/*"
      - "!**/.DS_Store"
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!tests/**"
      - "!**/tests/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!README.md"
      - "!**/*.md"
      - "!python/**"
      - "!venv/**"
      - "!**/.DS_Store"
  - from: frontend/assets/studio-manuals
    to: studio-manuals
    filter:
      - "**/*"
      # 道劫=个人资产不入包(用户裁定 08-15);真源在项目侧 <项目根>/skills,
      # 仓库种子仅作迁移源保留。story 侧 Daojie_xianxia 此前漏排(08-25 补)。
      - "!art_skills/daojie_ink_guofeng/**"
      - "!story_skills/Daojie_xianxia/**"
  # 成片调色 LUT 资产（08-18-haldclut-grade；生成源 build/scripts/generate-luts.py）。
  - from: frontend/assets/luts
    to: luts
    filter:
      - "**/*.png"
      - LICENSES.md
  # 转场音效资产（08-18-sfx-beat；Kenney CC0）。
  - from: frontend/assets/sfx
    to: sfx
    filter:
      - "**/*.ogg"
      - LICENSES.md
  # MiniMax-Music3 音乐生成技能资产（08-20;caption 技能全文库 SKILL/references/templates
  # + lessons + 实证配方;渲染层配方经 ?raw 进 asar,此处整库供主进程/未来 LLM 代理路径）。
  - from: frontend/assets/minimax
    to: minimax
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/__MACOSX/**"
      - "!**/.cache/**"
      - "!**/__pycache__/**"
      - "!**/coverage/**"
      - "!**/node_modules/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/*.tmp"
      - "!**/*.bak"
      - "!**/*.map"
      - "!**/*.tsbuildinfo"
      - "!**/*.psd"
      - "!**/*.zip"
asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@remotion/compositor-darwin-arm64/**"
  - "node_modules/@remotion/compositor-win32-x64-msvc/**"
  - "out/main/remotion-browser-worker.cjs"
  - "out/main/remotion-render-worker.cjs"
  - "out/main/hyperframes-worker.cjs"
  - "out/main/chunks/**"

# 图标配置
icon: frontend/assets/brand/manying-studio-icon.ico

mac:
  icon: frontend/assets/brand/manying-studio-icon.icns
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip

win:
  executableName: manying-studio
  icon: frontend/assets/brand/manying-studio-icon.ico
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装包配置
nsis:
  include: frontend/config/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: 漫影工作室
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: frontend/assets/brand/manying-studio-icon.ico
  uninstallerIcon: frontend/assets/brand/manying-studio-icon.ico
  installerHeaderIcon: frontend/assets/brand/manying-studio-icon.ico
