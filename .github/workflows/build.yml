name: Build Desktop

on:
  pull_request:
    branches:
      - main
  push: {}
  workflow_dispatch:
    inputs:
      version:
        description: "手动构建版本（可选，例如 0.0.1）"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mystudio-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate release or manual version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != v* ]]; then
              echo "Invalid release tag: ${GITHUB_REF_NAME}; expected vX.Y.Z" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${MANUAL_VERSION}" ]]; then
            version="${MANUAL_VERSION}"
          else
            version="$(node -p "require('./apps/package.json').version")"
          fi

          node - "${version}" <<'NODE'
          const version = process.argv[2];
          const stableSemver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (!stableSemver.test(version)) {
            console.error(`Invalid stable version: ${version}; expected X.Y.Z`);
            process.exit(1);
          }
          NODE

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${version}"

  quality:
    name: Quality gate
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        # 与本地同源(apps/packageManager 钉 pnpm@10.26.2+sha512):apps/patches 的
        # remotion 补丁仅对 pnpm 生效,此前 npm ci 打出的包缺补丁、与本地漂移。
        run: corepack enable && corepack prepare pnpm@10.26.2 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/build/requirements-ci.txt

      - name: Install ffmpeg toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python build-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/mystudio-ci-venv"
          echo "${RUNNER_TEMP}/mystudio-ci-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/mystudio-ci-venv/bin/python" -m pip install --requirement apps/build/requirements-ci.txt

      - name: Install Node dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Quality gate (typecheck + lint + test + smoke)
        working-directory: apps
        # `npm run test:all` -> build/scripts/run-quality-gate.mjs runs the
        # aggregate gate: focused-tests, typecheck, lint, unit tests and
        # smoke:aitoearn-upgrade. The release-only stages (build:mac,
        # smoke:desktop) require macOS + a desktop session, so the script
        # auto-skips them on non-darwin runners via process.platform detection.
        run: npm run test:all

      - name: Diagnose quality-gate failure (temporary)
        if: failure()
        shell: bash
        working-directory: apps
        run: node build/scripts/ci-diagnose.mjs

      - name: Build renderer
        working-directory: apps
        run: npx electron-vite build --config frontend/config/electron-vite.config.ts

  release-prep:
    name: Prepare fixed Remotion bundle
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - resolve-version
      - quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        # 与本地同源(apps/packageManager 钉 pnpm@10.26.2+sha512):apps/patches 的
        # remotion 补丁仅对 pnpm 生效,此前 npm ci 打出的包缺补丁、与本地漂移。
        run: corepack enable && corepack prepare pnpm@10.26.2 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install ffmpeg toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Sync package version in CI workspace
        working-directory: apps
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Install Node dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Generate fixed Remotion bundle
        working-directory: apps
        run: npm run remotion:bundle

      - name: Verify Remotion versions
        working-directory: apps
        run: npm run remotion:versions

      - name: Upload fixed Remotion bundle for platform jobs
        uses: actions/upload-artifact@v4
        with:
          name: mystudio-remotion-bundle-${{ needs.resolve-version.outputs.version }}
          path: apps/.cache/remotion-bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  build-mac:
    name: Build macOS ARM64
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - resolve-version
      - release-prep
    runs-on: macos-14
    env:
      MYSTUDIO_DISABLE_ELECTRON_PUBLISH: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        # 与本地同源(apps/packageManager 钉 pnpm@10.26.2+sha512):apps/patches 的
        # remotion 补丁仅对 pnpm 生效,此前 npm ci 打出的包缺补丁、与本地漂移。
        run: corepack enable && corepack prepare pnpm@10.26.2 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install ffmpeg toolchain
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Sync package version in CI workspace
        working-directory: apps
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Install Node dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Download fixed Remotion bundle
        uses: actions/download-artifact@v4
        with:
          name: mystudio-remotion-bundle-${{ needs.resolve-version.outputs.version }}
          path: apps/.cache/remotion-bundle

      - name: Build, install and smoke-test macOS package
        working-directory: apps
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 无头 runner 上被测应用是唯一 GUI 应用,前台检查必假阳性;豁免之
          # (检查仍对真实用户桌面的本地 installed smoke 生效)。
          MYSTUDIO_SMOKE_ALLOW_FOREGROUND: "1"
        run: npm run build:mac

      - name: Collect macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/mystudio-release-assets"
          mkdir -p "${destination}"
          find apps/release/build -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} "${destination}/" \;
          if [[ -z "$(find "${destination}" -type f -print -quit)" ]]; then
            echo "No macOS DMG or ZIP assets were produced" >&2
            exit 1
          fi

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: mystudio-macos-${{ needs.resolve-version.outputs.version }}
          path: ${{ runner.temp }}/mystudio-release-assets/*
          if-no-files-found: error
          retention-days: 14

  build-win:
    name: Build Windows x64
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - resolve-version
      - release-prep
    runs-on: windows-latest
    env:
      MYSTUDIO_DISABLE_ELECTRON_PUBLISH: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        # 与本地同源(apps/packageManager 钉 pnpm@10.26.2+sha512):apps/patches 的
        # remotion 补丁仅对 pnpm 生效,此前 npm ci 打出的包缺补丁、与本地漂移。
        run: corepack enable && corepack prepare pnpm@10.26.2 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install ffmpeg toolchain
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Sync package version in CI workspace
        working-directory: apps
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: pwsh
        run: npm version $env:VERSION --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Install Node dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Download fixed Remotion bundle
        uses: actions/download-artifact@v4
        with:
          name: mystudio-remotion-bundle-${{ needs.resolve-version.outputs.version }}
          path: apps/.cache/remotion-bundle

      - name: Build Windows package
        working-directory: apps
        run: npm run build:win

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "mystudio-release-assets"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem -Path "apps/release/build" -Recurse -File -Filter "*setup.exe" |
            Copy-Item -Destination $destination
          if (-not (Get-ChildItem -Path $destination -File | Select-Object -First 1)) {
            throw "No Windows setup.exe asset was produced"
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: mystudio-windows-${{ needs.resolve-version.outputs.version }}
          path: ${{ runner.temp }}/mystudio-release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - resolve-version
      - build-mac
      - build-win
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: mystudio-macos-${{ needs.resolve-version.outputs.version }}
          path: release-assets

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: mystudio-windows-${{ needs.resolve-version.outputs.version }}
          path: release-assets

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -type f -name '*.zip' -print -quit)"
          test -n "$(find release-assets -type f -name '*setup.exe' -print -quit)"

      - name: Generate SHA256SUMS for release assets
        # 免费的完整性兜底:安装包未签名期间,用户可对照 SHA256SUMS.txt 核验
        # 下载文件未被传输链路篡改(与 checksum 文件一同发布到 Release)。
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        # 固定到具体提交(供应链防护):该 action 持有 contents:write,浮动 tag
        # 被上游劫持即可投毒发布物。升级时改 SHA 并同步注释版本号。
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          body: |
            本版本由 GitHub Actions 自动构建。

            当前 macOS 与 Windows 安装包尚未配置代码签名，首次安装可能需要在系统安全提示中手动确认。

            下载后可在终端校验完整性：`shasum -a 256 -c SHA256SUMS.txt`（Windows: `certutil -hashfile 文件名 SHA256`），对照本页 SHA256SUMS.txt。
